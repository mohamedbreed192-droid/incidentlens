[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentlens"
version = "0.1.0"
description = "Synthetic IT incident investigation portfolio prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "SQLAlchemy==2.0.41",
  "psycopg[binary]==3.2.9", "alembic==1.16.1", "pydantic-settings==2.9.1",
  "pwdlib[argon2]==0.2.1", "httpx==0.28.1", "python-multipart==0.0.20",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.12", "playwright==1.52.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
